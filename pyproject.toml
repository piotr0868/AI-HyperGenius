[project]
name = "assistente-officina"
version = "0.2.0"
description = "Assistente personale in italiano per piccoli backend Python, con memoria e verifiche isolate"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "openai==3.29.0",
  "groq==1.7.0",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
